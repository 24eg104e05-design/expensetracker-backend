spring.application.name=expensetracker

# ---------------------------------------------------------------------------
# Datasource (PRD 5: MySQL 8.x). Defaults target the local podman container
# `expense-mysql`; override via env for any other environment.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expensetracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:apppass123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------------
# JPA / Flyway. Flyway owns the schema so PRD section 6 DDL and its indexes are
# applied verbatim instead of being inferred from entities.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------------------
# JWT (PRD 4.1 / NFR Security). HMAC-SHA256 requires a secret of >= 256 bits.
# Always supply JWT_SECRET in deployed environments.
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:dev-only-change-me-expensetracker-hs256-secret-key-min-32-bytes}
app.jwt.expiration=3600000
app.jwt.issuer=expensetracker

# ---------------------------------------------------------------------------
# CORS (PRD 5). Explicit origins only -- never wildcard with credentials.
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ---------------------------------------------------------------------------
# Display. The rupee sign is written as a unicode escape because .properties
# files are read as ISO-8859-1 by default.
# ---------------------------------------------------------------------------
app.currency.symbol=\u20B9
app.currency.code=INR
app.currency.locale=en-IN

server.port=${SERVER_PORT:8080}